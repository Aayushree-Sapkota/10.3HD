name: 04 - Deploy to Production

on:
  # Automated trigger: runs automatically when Staging tests pass
  workflow_run:
    workflows:
      - "03 - Test Staging"
    types:
      - completed
    branches:
      - main

  # Manual trigger fallback
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tested image SHA to deploy"
        required: false
        type: string

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest

    # Only run if manual trigger OR if staging tests succeeded
    if: >
      ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: production

    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Display deployment metadata
        run: |
          echo "=========================================="
          echo "Starting Continuous Deployment to Production"
          echo "Trigger Event: ${{ github.event_name }}"
          echo "Deploying Image Tag / Commit SHA: ${{ env.IMAGE_TAG }}"
          echo "=========================================="

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Create production namespace
        run: |
          kubectl create namespace production \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create PostgreSQL secret
        run: |
          kubectl create secret generic postgres-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create application secret
        run: |
          kubectl create secret generic application-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=DEFAULT_ADMIN_USERNAME="${{ secrets.DEFAULT_ADMIN_USERNAME }}" \
            --from-literal=DEFAULT_ADMIN_EMAIL="${{ secrets.DEFAULT_ADMIN_EMAIL }}" \
            --from-literal=DEFAULT_ADMIN_PASSWORD="${{ secrets.DEFAULT_ADMIN_PASSWORD }}" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply \
            -f kubernetes/production/

      #Implement active/inactive detection

      - name: Determine active and inactive slots
        id: slots
        run: |
          ACTIVE_SLOT=$(kubectl get service frontend \
            -n production \
            -o jsonpath='{.spec.selector.slot}')

          if [ "$ACTIVE_SLOT" = "blue" ]; then
            INACTIVE_SLOT="green"
          else
            INACTIVE_SLOT="blue"
          fi

          echo "Active slot: $ACTIVE_SLOT"
          echo "Inactive slot: $INACTIVE_SLOT"

          echo "active_slot=$ACTIVE_SLOT" >> "$GITHUB_OUTPUT"
          echo "inactive_slot=$INACTIVE_SLOT" >> "$GITHUB_OUTPUT"
        

      # Update the latest image to inactive slot    
      - name: Deploy new frontend to inactive slot
        run: |
          kubectl set image \
            deployment/frontend-${{ steps.slots.outputs.inactive_slot }} \
            frontend=${{ vars.ACR_LOGIN_SERVER }}/koalatech-frontend:${{ env.IMAGE_TAG }} \
            -n production

      - name: Update user-service image
        run: |
          kubectl set image deployment/user-service \
            user-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-user-service:${{ env.IMAGE_TAG }} \
            -n production

      - name: Update student-service image
        run: |
          kubectl set image deployment/student-service \
            student-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-student-service:${{ env.IMAGE_TAG }} \
            -n production

      - name: Update lecturer-service image
        run: |
          kubectl set image deployment/lecturer-service \
            lecturer-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-lecturer-service:${{ env.IMAGE_TAG }} \
            -n production

      - name: Update course-service image
        run: |
          kubectl set image deployment/course-service \
            course-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-course-service:${{ env.IMAGE_TAG }} \
            -n production

      - name: Update enrollment-service image
        run: |
          kubectl set image deployment/enrollment-service \
            enrollment-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-enrollment-service:${{ env.IMAGE_TAG }} \
            -n production

      # rollout new deployment to inactive slots
      - name: Wait for candidate frontend rollout
        run: |
          kubectl rollout status \
            deployment/frontend-${{ steps.slots.outputs.inactive_slot }} \
            -n production \
            --timeout=300s

      - name: Wait for user-service rollout
        run: |
          kubectl rollout status deployment/user-service \
            -n production \
            --timeout=300s

      - name: Wait for student-service rollout
        run: |
          kubectl rollout status deployment/student-service \
            -n production \
            --timeout=300s

      - name: Wait for lecturer-service rollout
        run: |
          kubectl rollout status deployment/lecturer-service \
            -n production \
            --timeout=300s

      - name: Wait for course-service rollout
        run: |
          kubectl rollout status deployment/course-service \
            -n production \
            --timeout=300s

      - name: Wait for enrollment-service rollout
        run: |
          kubectl rollout status deployment/enrollment-service \
            -n production \
            --timeout=300s

      - name: Point candidate service to inactive slot
        run: |
          kubectl patch service frontend-candidate \
            -n production \
            -p '{"spec":{"selector":{"app":"frontend","slot":"${{ steps.slots.outputs.inactive_slot }}"}}}'

          echo "Candidate service now points to ${{ steps.slots.outputs.inactive_slot }}"
      
      - name: Smoke test candidate deployment
        run: |
          echo "Testing candidate slot: ${{ steps.slots.outputs.inactive_slot }}"
          kubectl run frontend-smoke-test \
            --namespace production \
            --image=curlimages/curl:latest \
            --restart=Never \
            --rm \
            --attach \
            --command -- \
            curl --fail \
                 --silent \
                 --show-error \
                 --retry 5 \
                 --retry-delay 5 \
                 --max-time 10 \
                 http://frontend-candidate

      - name: Switch production traffic to candidate
        run: |
          echo "Switching production traffic..."
          echo "From: ${{ steps.slots.outputs.active_slot }}"
          echo "To:   ${{ steps.slots.outputs.inactive_slot }}"

          kubectl patch service frontend \
            -n production \
            -p '{"spec":{"selector":{"app":"frontend","slot":"${{ steps.slots.outputs.inactive_slot }}"}}}'

          echo "Production traffic switched successfully."

      - name: Verify production traffic switch
        run: |
          NEW_ACTIVE_SLOT=$(kubectl get service frontend \
            -n production \
            -o jsonpath='{.spec.selector.slot}')

          echo "Production service is pointing to: $NEW_ACTIVE_SLOT"

          if [ "$NEW_ACTIVE_SLOT" != "${{ steps.slots.outputs.inactive_slot }}" ]; then
            echo "ERROR: Production traffic switch failed."
            exit 1
          fi

          echo "Traffic switch verified successfully."

      - name: Post-deployment validation with automatic rollback
        run: |
          echo "=========================================="
          echo "Post-Deployment Production Validation"
          echo "New slot: ${{ steps.slots.outputs.inactive_slot }}"
          echo "Rollback slot: ${{ steps.slots.outputs.active_slot }}"
          echo "=========================================="

          # Wait briefly for the Service endpoints to update
          sleep 10

          PROD_IP=$(kubectl get service frontend \
            -n production \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

          echo "Production IP: $PROD_IP"
          echo "Testing newly activated production deployment..."

          if curl --fail \
                  --silent \
                  --show-error \
                  --retry 5 \
                  --retry-delay 5 \
                  --max-time 10 \
                  "http://${PROD_IP}"; then

            echo "=========================================="
            echo "Production validation PASSED"
            echo "New deployment remains active."
            echo "=========================================="

          else

            echo "=========================================="
            echo "Production validation FAILED"
            echo "Starting automatic rollback..."
            echo "=========================================="

            kubectl patch service frontend \
              -n production \
              -p '{"spec":{"selector":{"app":"frontend","slot":"${{ steps.slots.outputs.active_slot }}"}}}'

            echo "Production traffic restored to:"
            echo "${{ steps.slots.outputs.active_slot }}"

            sleep 10

            ROLLBACK_SLOT=$(kubectl get service frontend \
              -n production \
              -o jsonpath='{.spec.selector.slot}')

            if [ "$ROLLBACK_SLOT" != "${{ steps.slots.outputs.active_slot }}" ]; then
              echo "CRITICAL: Rollback selector verification failed."
              exit 1
            fi

            echo "Rollback selector verified."

            # Fail the workflow intentionally because the deployment failed.
            exit 1
          fi

      - name: Show production resources
        run: |
          kubectl get pods -n production
          kubectl get services -n production
          kubectl get pvc -n production

      - name: Show production frontend URL
        run: |
          echo "=========================================="
          echo "Production Application Deployment Complete"
          echo "=========================================="
          kubectl get service frontend -n production
          PROD_IP=$(kubectl get service frontend -n production -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "Production Application External IP: $PROD_IP"
          echo "Production Application URL: http://${PROD_IP}"
          echo "Deployed Image Tag: ${{ env.IMAGE_TAG }}"